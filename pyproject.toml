[project]
name = "mavforge"
version = "0.1.0.dev0"
description = "Intelligent tools for flight controllers: verified MAVLink configuration, diagnostics and calibration for humans, scripts and AI agents."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marc A. Smith", email = "msmith626@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pymavlink>=2.4.50,<2.5",
    "pydantic>=2.12,<3",
    "typer>=0.27",
    "rich>=14",
    "mcp>=2.3,<3",
    "pyserial>=3.5,<4",
    "defusedxml>=0.7.1,<1",
]

[project.scripts]
mavforge = "mavforge.cli.app:main"
mavforge-mcp = "mavforge.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-timeout>=2.3",
    "ruff>=0.17",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mavforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "TID"]
ignore = ["S101"]  # asserts narrow untyped pymavlink messages after isinstance-filtered waits

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
# pymavlink ships no py.typed marker; treat it as untyped and wrap it at the transport boundary.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
executionEnvironments = [
    { root = "tests", reportPrivateUsage = false },
    { root = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not sitl and not hardware"]
markers = [
    "sitl: requires ArduPilot SITL (Docker); run with -m sitl",
    "hardware: talks to a real flight controller; opt-in via MAVFORGE_HW_CONNECTION; run with -m hardware",
]
timeout = 60
